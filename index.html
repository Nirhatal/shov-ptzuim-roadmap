// ==== Persisted state + transient UI state ====
let state = { tracks:[], items:[], partners:[], requests:[], trainings:[], nextTrackId:1, nextItemId:1, nextPartnerId:1, nextRequestId:1, nextTrainingId:1 };
let ui = {
  view: 'overview', role: 'editor', loading: true,
  query: '', trackFilter: '', statusFilter: '', typeFilter: '',
  reqView: 'kanban', urgencyFilter: '', reqQuery: '', trainingsQuery: '',
  addOpen: false, addKind: null, form: null,
  confirmOpen: false, confirmMsg: '', confirmFn: null,
  saveState: 'טוען...'
};

function trackById(id){ return state.tracks.find(t=>t.id===id); }
function trackColor(id){ const idx = state.tracks.findIndex(t=>t.id===id); return TRACK_COLORS[(idx<0?0:idx)%8]; }
function fmt(d){ if(!d) return '—'; const p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0].slice(2); }
function qIndex(dateStr){ const [y,m]=dateStr.split('-').map(Number); return (y-2026)*4+Math.floor((m-1)/3); }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ==== Persistence (Firebase, with localStorage fallback) ====
async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    if(res && res.value){
      const loaded = JSON.parse(res.value);
      state = { ...seed(), ...loaded };
      ui.saveState = 'הנתונים נטענו';
    } else {
      state = seed();
      await window.storage.set(STORAGE_KEY, JSON.stringify(state));
      ui.saveState = 'נוצרו נתוני פתיחה';
    }
  } catch(e){
    console.error(e);
    state = seed();
    ui.saveState = 'עובד במצב זמני (אין חיבור לאחסון) — שינויים לא יישמרו';
  }
  ui.loading = false;
  render();
}
async function saveData(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state));
    ui.saveState = 'נשמר';
  } catch(e){
    console.error(e);
    ui.saveState = 'שמירה נכשלה';
  }
  render();
}

// ==== Focus-preserving re-render ====
function render(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && 'selectionStart' in active ? active.selectionStart : null;
  const selEnd = active && 'selectionEnd' in active ? active.selectionEnd : null;
  document.getElementById('app').innerHTML = renderApp();
  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

function go(view){ ui.view=view; render(); }
function goTrack(trackId){ ui.view='items'; ui.trackFilter=String(trackId); ui.query=''; ui.statusFilter=''; ui.typeFilter=''; render(); }
function setRole(role){ ui.role=role; if(role==='viewer'){ ui.addOpen=false; } render(); }

// ==== Modal (add/edit) ====
function openAdd(kind, existing){
  ui.addKind = kind;
  ui.addOpen = true;
  if(kind==='item'){
    ui.form = existing ? {...existing, start: existing.start||'', end: existing.end||''} : {track: state.tracks[0]?.id||1, type:'task', name:'', owner:'', status:'planned', start:'', end:'', notes:''};
  } else if(kind==='partner'){
    ui.form = existing ? {...existing, tracksStr:(existing.tracks||[]).join(',')} : {name:'', role:'', tracksStr:'', notes:''};
  } else if(kind==='training'){
    ui.form = existing ? {...existing} : {unit:'', date:'', instructor:'', notes:''};
  } else if(kind==='request'){
    ui.form = existing ? {...existing, date: existing.date||''} : {category: ui.view==='reqDash'?'dash':'app', title:'', requester:'', urgency:'medium', status:'pending', notes:'', date:''};
  }
  render();
}
function closeAdd(){ ui.addOpen=false; ui.form=null; render(); }
function setForm(k,v){ ui.form[k]=v; render(); }

function submitAdd(){
  const f = ui.form;
  if(ui.addKind==='item'){
    if(!f.name || !f.name.trim()){ closeAdd(); return; }
    const rec = { ...f, track:Number(f.track), start:f.start||null, end:f.end||null, notes:f.notes||'' };
    if(f.id){ state.items = state.items.map(i=>i.id===f.id?{...i,...rec}:i); }
    else { rec.id = state.nextItemId++; state.items.push(rec); }
    ui.view='items';
  } else if(ui.addKind==='partner'){
    if(!f.name || !f.name.trim()){ closeAdd(); return; }
    const tracks = (f.tracksStr||'').split(',').map(s=>Number(s.trim())).filter(Boolean);
    const rec = { name:f.name, role:f.role||'', tracks, notes:f.notes||'' };
    if(f.id){ state.partners = state.partners.map(p=>p.id===f.id?{...p,...rec}:p); }
    else { rec.id = state.nextPartnerId++; state.partners.push(rec); }
    ui.view='partners';
  } else if(ui.addKind==='training'){
    if(!f.unit || !f.unit.trim()){ closeAdd(); return; }
    const rec = { unit:f.unit, date:f.date||null, instructor:f.instructor||'', notes:f.notes||'' };
    if(f.id){ state.trainings = state.trainings.map(t=>t.id===f.id?{...t,...rec}:t); }
    else { rec.id = state.nextTrainingId++; state.trainings.push(rec); }
    ui.view='trainings';
  } else if(ui.addKind==='request'){
    if(!f.title || !f.title.trim()){ closeAdd(); return; }
    const rec = { category:f.category, title:f.title, requester:f.requester||'', urgency:f.urgency, status:f.status, notes:f.notes||'', date:f.date||null };
    if(f.id){ state.requests = state.requests.map(r=>r.id===f.id?{...r,...rec}:r); }
    else { rec.id = state.nextRequestId++; state.requests.push(rec); }
    ui.view = f.category==='dash' ? 'reqDash' : 'reqApp';
  }
  ui.addOpen=false; ui.form=null;
  saveData();
}

function askConfirm(msg, fn){ ui.confirmOpen=true; ui.confirmMsg=msg; ui.confirmFn=fn; render(); }
function confirmYes(){ const fn=ui.confirmFn; ui.confirmOpen=false; ui.confirmFn=null; if(fn) fn(); }
function confirmNo(){ ui.confirmOpen=false; ui.confirmFn=null; render(); }

function deleteItemRec(){ const f=ui.form; askConfirm('למחוק את הפריט?', ()=>{ state.items=state.items.filter(i=>i.id!==f.id); ui.addOpen=false; ui.form=null; saveData(); }); }
function deletePartnerRec(){ const f=ui.form; askConfirm('למחוק את השותף?', ()=>{ state.partners=state.partners.filter(p=>p.id!==f.id); ui.addOpen=false; ui.form=null; saveData(); }); }
function deleteTrainingRec(){ const f=ui.form; askConfirm('למחוק את תיעוד ההדרכה?', ()=>{ state.trainings=state.trainings.filter(t=>t.id!==f.id); ui.addOpen=false; ui.form=null; saveData(); }); }
function deleteRequestRec(){ const f=ui.form; askConfirm('למחוק את בקשת השיפור?', ()=>{ state.requests=state.requests.filter(r=>r.id!==f.id); ui.addOpen=false; ui.form=null; saveData(); }); }
function deleteTrack(id){
  const n = state.items.filter(i=>i.track===id).length;
  if(n>0 || ui.role!=='editor') return;
  askConfirm('למחוק את הטראק?', ()=>{ state.tracks=state.tracks.filter(t=>t.id!==id); saveData(); });
}
function addTrackPrompt(){
  const name = (document.getElementById('newTrackName')||{}).value;
  if(!name || !name.trim()) return;
  state.tracks.push({ id: state.nextTrackId++, name: name.trim() });
  saveData();
}

function renderHeader(){
  const canEdit = ui.role==='editor';
  return `
  <header style="display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:5">
    <strong style="font-size:14px;font-weight:600;white-space:nowrap">${TITLES[ui.view]}</strong>
    <span style="width:1px;height:16px;background:var(--border)"></span>
    <span style="font-size:12px;color:var(--muted-foreground);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis">${SUBTITLES[ui.view]}</span>
    <span style="flex:1"></span>
    <label style="display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--input);border-radius:10px;background:var(--background);width:260px;flex-shrink:0;min-width:220px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted-foreground);flex-shrink:0"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="globalSearch" type="search" placeholder="חיפוש בפריטים, שותפים, טראקים" value="${esc(ui.query)}" oninput="onSearch(this.value)" style="border:none;outline:none;background:transparent;font-size:13px;color:var(--foreground);width:100%" />
    </label>
    ${canEdit ? `<button type="button" onclick="openAdd('item')" style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:none;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg> פריט חדש</button>` : ''}
  </header>`;
}

function renderOverview(){
  const items = state.items;
  const ongoingCount = items.filter(i=>i.status==='ongoing').length;
  const milestones = items.filter(i=>i.type==='milestone');
  const tbd = milestones.filter(i=>!i.start);
  const appReqs = state.requests.filter(r=>r.category==='app');
  const kpis = [
    { label:'פריטים במעקב', value: items.length, hint: `${state.tracks.length} טראקים פעילים`, soft:'var(--indigo-50)', ink:'var(--indigo-700)', dot:'var(--indigo-500)' },
    { label:'בתהליך עכשיו', value: ongoingCount, hint: `מתוך ${items.length} פריטים`, soft:'var(--blue-50)', ink:'var(--blue-700)', dot:'var(--blue-500)' },
    { label:'אבני דרך ללא תאריך', value: tbd.length, hint: `מתוך ${milestones.length} אבני דרך`, soft:'var(--amber-50)', ink:'var(--amber-700)', dot:'var(--amber-500)' },
    { label:'בקשות שיפור מהשטח', value: appReqs.length, hint: `אפליקציה · ${state.partners.length} שותפים בפרויקט`, soft:'var(--cyan-50)', ink:'var(--cyan-700)', dot:'var(--cyan-600)' }
  ];
  const kpiHtml = kpis.map(k=>`
    <div style="${kpiCardStyle(k.soft)}">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="width:8px;height:8px;border-radius:9999px;background:${k.dot};flex-shrink:0"></span>
        <span style="font-size:12px;color:var(--muted-foreground)">${esc(k.label)}</span>
      </div>
      <strong style="font-size:30px;font-weight:600;line-height:1.1;color:${k.ink};font-variant-numeric:tabular-nums">${k.value}</strong>
      <span style="font-size:12px;color:var(--muted-foreground)">${esc(k.hint)}</span>
    </div>`).join('');

  const cardsHtml = ui.loading ? Array.from({length:8}).map(()=>`
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:shimmer 1.4s ease-in-out infinite">
        <span style="height:20px;width:60%;border-radius:6px;background:var(--muted)"></span>
        <span style="height:12px;width:85%;border-radius:6px;background:var(--muted)"></span>
        <span style="height:8px;width:100%;border-radius:9999px;background:var(--muted)"></span>
      </div>`).join('')
    : state.tracks.map((t,i)=>{
      const own = items.filter(it=>it.track===t.id);
      const done = own.filter(i=>i.status==='done').length;
      const ongoing = own.filter(i=>i.status==='ongoing').length;
      const planned = own.filter(i=>i.status==='planned').length;
      const owners = [...new Set(own.flatMap(i=>(i.owner||'').split(',').map(x=>x.trim()).filter(Boolean)))];
      const c = TRACK_COLORS[i%8];
      const total = own.length || 1;
      return `
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm)">
        <button type="button" onclick="goTrack(${t.id})" style="${badgeStyle(c)}">${esc(t.name)}</button>
        <span style="font-size:12px;color:var(--muted-foreground);line-height:1.45;min-height:34px">${esc(owners.length?owners.slice(0,3).join(' · '):'אין שותפים מוגדרים')}</span>
        <div style="display:flex;height:6px;border-radius:9999px;overflow:hidden;background:var(--muted)">
          <span style="width:${done/total*100}%;background:${STATUS.done.solid}"></span>
          <span style="width:${ongoing/total*100}%;background:${STATUS.ongoing.solid}"></span>
        </div>
        <div style="display:flex;gap:12px;font-size:12px;color:var(--muted-foreground);flex-wrap:wrap">
          <span style="display:inline-flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:9999px;background:var(--emerald-500)"></span>${done} הושלמו</span>
          <span style="display:inline-flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:9999px;background:var(--blue-500)"></span>${ongoing} בתהליך</span>
          <span style="display:inline-flex;align-items:center;gap:5px"><span style="width:7px;height:7px;border-radius:9999px;background:var(--gray-400)"></span>${planned} מתוכננים</span>
        </div>
      </div>`;
    }).join('');

  return `
  <div style="display:flex;flex-direction:column;gap:20px">
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px">${kpiHtml}</div>
    <div style="display:flex;align-items:baseline;gap:10px">
      <h2 style="margin:0;font-size:16px;font-weight:600">טראקים</h2>
      <span style="font-size:12px;color:var(--muted-foreground)">לחיצה על טראק פותחת את ניהול המשימות מסונן אליו</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px">${cardsHtml}</div>
  </div>`;
}

function renderGantt(){
  const milestones = state.items.filter(i=>i.type==='milestone');
  const scheduled = milestones.filter(i=>i.start);
  const tbd = milestones.filter(i=>!i.start);
  const quarters = [];
  for(let y=2026;y<=2028;y++) for(let q=1;q<=4;q++) quarters.push({q:'Q'+q,y:String(y)});
  const rowsHtml = scheduled.map(i=>{
    const from = qIndex(i.start), to = i.end?qIndex(i.end):from;
    const st = STATUS[i.status];
    return `
    <div style="height:52px;padding:0 16px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-bottom:1px solid var(--border)">
      <span style="font-size:13px;font-weight:500">${esc(i.name)}</span>
      <span style="font-size:11px;color:var(--muted-foreground)">${esc(trackById(i.track).name)} · <span style="font-variant-numeric:tabular-nums">${fmt(i.start)} – ${fmt(i.end)}</span></span>
    </div>`;
  }).join('');
  const barsHtml = scheduled.map(i=>{
    const from = qIndex(i.start), to = i.end?qIndex(i.end):from;
    const st = STATUS[i.status];
    const cells = quarters.map(()=>`<span style="height:52px;border-inline-end:1px solid var(--border)"></span>`).join('');
    return `
    <div style="height:52px;position:relative;border-bottom:1px solid var(--border);display:grid;grid-template-columns:repeat(12,1fr);align-items:center">
      ${cells}
      <span style="grid-column:${from+1} / ${to+2};grid-row:1;height:22px;border-radius:6px;background:${st.solid};margin:0 4px;position:relative;z-index:2;overflow:hidden"></span>
    </div>`;
  }).join('');
  const quartersHtml = quarters.map(q=>`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;border-inline-end:1px solid var(--border);font-size:11px;color:var(--muted-foreground);gap:1px">
      <span style="font-weight:600;color:var(--foreground)">${q.q}</span><span>${q.y}</span>
    </div>`).join('');
  const tbdHtml = tbd.map(i=>`
    <span style="display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--border);border-radius:9999px;padding:6px 12px;font-size:12px;background:var(--background)">
      <span style="width:7px;height:7px;border-radius:9999px;background:${STATUS[i.status].solid};flex-shrink:0"></span>
      <span style="font-weight:500">${esc(i.name)}</span><span style="color:var(--muted-foreground)">${esc(trackById(i.track).name)}</span>
    </span>`).join('');
  return `
  <div style="display:flex;flex-direction:column;gap:20px">
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-sm)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap">
        <div style="display:flex;flex-direction:column;gap:2px">
          <strong style="font-size:14px;font-weight:600">ציר זמן אבני דרך · 2026–2028</strong>
          <span style="font-size:12px;color:var(--muted-foreground)">רבעונים; פס לכל אבן דרך שהוגדרו לה תאריכים</span>
        </div>
        <div style="display:flex;gap:14px;font-size:12px;color:var(--muted-foreground)">
          <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:var(--emerald-500)"></span>הושלם</span>
          <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:var(--blue-500)"></span>בתהליך</span>
          <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:var(--gray-400)"></span>מתוכנן</span>
        </div>
      </div>
      ${scheduled.length===0 ? `<div style="padding:32px 18px;text-align:center;color:var(--muted-foreground);font-size:13px">אין עדיין אבני דרך עם תאריכים.</div>` : `
      <div style="overflow-x:auto">
        <div style="min-width:900px;display:grid;grid-template-columns:260px 1fr">
          <div style="border-inline-end:1px solid var(--border);background:var(--card)">
            <div style="height:44px;display:flex;align-items:center;padding:0 16px;font-size:12px;font-weight:600;color:var(--muted-foreground);border-bottom:1px solid var(--border)">טראק / אבן דרך</div>
            ${rowsHtml}
          </div>
          <div>
            <div style="height:44px;display:grid;grid-template-columns:repeat(12,1fr);border-bottom:1px solid var(--border)">${quartersHtml}</div>
            ${barsHtml}
          </div>
        </div>
      </div>`}
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-sm)">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
        <strong style="font-size:14px;font-weight:600">אבני דרך ללא תאריך</strong>
        <span style="font-size:12px;color:var(--muted-foreground)">${tbd.length} מתוך ${milestones.length} אבני הדרך טרם תוארכו — הן נשמרות כאן כדי שלא יאבדו מהמעקב</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">${tbdHtml || '<span style="font-size:13px;color:var(--muted-foreground)">אין אבני דרך ללא תאריך</span>'}</div>
    </div>
  </div>`;
}

function renderItems(){
  const canEdit = ui.role==='editor';
  const filtered = state.items.filter(i=>{
    if(ui.trackFilter && String(i.track)!==ui.trackFilter) return false;
    if(ui.statusFilter && i.status!==ui.statusFilter) return false;
    if(ui.typeFilter && i.type!==ui.typeFilter) return false;
    if(ui.query){ const q=ui.query.trim().toLowerCase(); const tn=trackById(i.track).name.toLowerCase();
      if(!(i.name.toLowerCase().includes(q) || (i.owner||'').toLowerCase().includes(q) || tn.includes(q))) return false; }
    return true;
  });
  const trackOpts = state.tracks.map(t=>`<option value="${t.id}" ${ui.trackFilter===String(t.id)?'selected':''}>${esc(t.name)}</option>`).join('');
  const rowsHtml = filtered.map(it=>{
    const c = trackColor(it.track); const st = STATUS[it.status];
    return `
    <div style="display:grid;grid-template-columns:170px minmax(220px,1fr) 96px 190px 110px 96px 96px 84px;gap:0;padding:10px 16px;align-items:center;border-top:1px solid var(--border);font-size:13px">
      <span><span style="${smallBadge(c)}">${esc(trackById(it.track).name)}</span></span>
      <span style="display:flex;flex-direction:column;gap:2px;padding-inline-end:12px">
        <span style="font-weight:500">${esc(it.name)}</span>
        <span style="font-size:11px;color:var(--muted-foreground)">${esc(it.notes||'')}</span>
      </span>
      <span style="font-size:12px;color:var(--muted-foreground)">${it.type==='milestone'?'אבן דרך':'משימה'}</span>
      <span style="font-size:12px;color:var(--muted-foreground);padding-inline-end:10px">${esc(it.owner||'—')}</span>
      <span><span style="${smallBadge(st)}">${st.label}</span></span>
      <span style="font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums">${fmt(it.start)}</span>

      <span style="display:flex;justify-content:flex-end">
        ${canEdit?`<button type="button" onclick='openAdd("item", ${JSON.stringify(it).replace(/'/g,"&#39;")})' style="height:28px;padding:0 10px;border:1px solid var(--input);border-radius:8px;background:var(--background);color:var(--foreground);font-size:12px;cursor:pointer">עריכה</button>`:''}
      </span>
    </div>`;

  return `
  <div style="display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <input id="itemsSearch" type="search" placeholder="חיפוש לפי שם פריט" value="${esc(ui.query)}" oninput="onItemsSearch(this.value)" style="height:36px;padding:0 12px;border:1px solid var(--input);border-radius:10px;background:var(--background);color:var(--foreground);font-size:13px;width:240px;outline:none" />
      <select onchange="onTrackFilter(this.value)" style="height:36px;padding:0 12px;border:1px solid var(--input);border-radius:10px;background:var(--background);color:var(--foreground);font-size:13px;outline:none"><option value="">כל הטראקים</option>${trackOpts}</select>
      <select onchange="onStatusFilter(this.value)" style="height:36px;padding:0 12px;border:1px solid var(--input);border-radius:10px;background:var(--background);color:var(--foreground);font-size:13px;outline:none">
        <option value="">כל הסטטוסים</option><option value="done" ${ui.statusFilter==='done'?'selected':''}>הושלם</option><option value="ongoing" ${ui.statusFilter==='ongoing'?'selected':''}>בתהליך</option><option value="planned" ${ui.statusFilter==='planned'?'selected':''}>מתוכנן</option>
      </select>
      <select onchange="onTypeFilter(this.value)" style="height:36px;padding:0 12px;border:1px solid var(--input);border-radius:10px;background:var(--background);color:var(--foreground);font-size:13px;outline:none">
        <option value="">משימות ואבני דרך</option><option value="task" ${ui.typeFilter==='task'?'selected':''}>משימות</option><option value="milestone" ${ui.typeFilter==='milestone'?'selected':''}>אבני דרך</option>
      </select>
      <button type="button" onclick="clearFilters()" style="height:36px;padding:0 14px;border:1px solid var(--input);border-radius:10px;background:var(--background);color:var(--foreground);font-size:13px;cursor:pointer">ניקוי סינון</button>
      <span style="flex:1"></span>
      <span style="font-size:12px;color:var(--muted-foreground)">${filtered.length} מתוך ${state.items.length} פריטים</span>
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow-x:auto;box-shadow:var(--shadow-sm)">

          <span>טראק</span><span>שם הפריט</span><span>סוג</span><span>שותף / אחראי</span><span>סטטוס</span><span>התחלה</span><span>סיום</span><span></span>
        </div>
        ${rowsHtml || `<div style="border-top:1px solid var(--border);padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
          <strong style="font-size:14px;font-weight:600">לא נמצאו פריטים</strong>
          <span style="font-size:13px;color:var(--muted-foreground);max-width:320px">אין פריטים שמתאימים לסינון הנוכחי. אפשר לנקות את הסינון ולנסות מחדש.</span>
          <button type="button" onclick="clearFilters()" style="margin-top:6px;height:34px;padding:0 14px;border:1px solid var(--input);border-radius:10px;background:var(--background);color:var(--foreground);font-size:13px;cursor:pointer">ניקוי סינון</button>
        </div>`}
      </div>
    </div>
  </div>`;
}

    return `

        <span style="font-weight:500">${esc(p.name)}</span>

      <span style="flex:1"></span>
      ${canEdit?`<button type="button" onclick="openAdd('partner')" style="height:36px;padding:0 14px;border:1px solid var(--input);border-radius:10px;background:var(--background);color:var(--foreground);font-size:13px;cursor:pointer">הוספת שותף</button>`:''}
    </div>

      <div style="min-width:880px">
        <div style="display:grid;grid-template-columns:minmax(220px,1fr) 250px minmax(200px,1fr) 140px;padding:0 16px;height:42px;align-items:center;background:var(--muted);font-size:12px;font-weight:600;color:var(--muted-foreground)">
          <span>שותף / גורם</span><span>תפקיד בפרויקט</span><span>טראקים</span><span>פריטים מקושרים</span>
        </div>
        ${rowsHtml || `<div style="padding:32px;text-align:center;color:var(--muted-foreground);font-size:13px">אין עדיין שותפים</div>`}

function renderTracks(){
  const canEdit = ui.role==='editor';
  const rowsHtml = state.tracks.map((t,i)=>{
    const n = state.items.filter(it=>it.track===t.id).length;
    const c = TRACK_COLORS[i%8];
    const blocked = n>0 || !canEdit;
    return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-sm)">
      <span style="width:10px;height:34px;border-radius:4px;background:${c.solid};flex-shrink:0"></span>
      <span style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">
        <span style="font-size:13px;font-weight:600">${esc(t.name)}</span>
        <span style="font-size:11px;color:var(--muted-foreground)">${n?n+' פריטים משויכים':'אין פריטים משויכים'}</span>
      </span>
      <button type="button" onclick="deleteTrack(${t.id})" title="${blocked?'לא ניתן למחוק — משויכים לו פריטים':'מחיקת הטראק'}"
        style="height:30px;padding:0 12px;border-radius:8px;font-size:12px;font-family:inherit;border:1px solid var(--input);background:var(--background);color:${blocked?'var(--muted-foreground)':'var(--red-600)'};cursor:${blocked?'not-allowed':'pointer'};opacity:${blocked?.55:1}">מחיקה</button>
    </div>`;
  }).join('');
  return `
  <div style="display:flex;flex-direction:column;gap:16px">
    <span style="font-size:13px;color:var(--muted-foreground)">לא ניתן למחוק טראק שמשויכים אליו פריטים — כפתור המחיקה חסום.</span>
    ${ui.role==='editor' ? `<div style="display:flex;gap:8px;align-items:center">
      <input id="newTrackName" type="text" placeholder="שם טראק חדש" style="height:36px;padding:0 12px;border:1px solid var(--input);border-radius:10px;background:var(--background);color:var(--foreground);font-size:13px;width:260px" />
      <button type="button" onclick="addTrackPrompt()" style="height:36px;padding:0 14px;border:none;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font-size:13px;font-weight:500;cursor:pointer">הוספת טראק</button>
    </div>` : ''}
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">${rowsHtml}</div>
  </div>`;
}

    return `
    <div style="display:flex;flex-direction:column;gap:16px">
      ${toolbar}
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:72px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:var(--shadow-sm)">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:var(--cyan-50);color:var(--cyan-700);font-size:18px;font-weight:600">0</span>
        <strong style="font-size:15px;font-weight:600">טרם הוזנו בקשות שיפור</strong>
        <span style="font-size:13px;color:var(--muted-foreground);max-width:400px;line-height:1.6">בקשות שיתקבלו יופיעו כאן, עם אותה תצוגת קנבן וטבלה.</span>
      </div>
    </div>`;
  }

  const decorate = r => ({ ...r, u:URGENCY[r.urgency], st:REQ_STATUS[r.status] });
  if(ui.reqView==='kanban'){
    const cols = REQ_STATUS_ORDER.map(key=>{
      const cards = filtered.filter(r=>r.status===key).map(decorate);
      const cardsHtml = cards.map(r=>`
        <div onclick='openAdd("request", ${JSON.stringify(r).replace(/'/g,"&#39;")})' style="border:1px solid var(--border);border-radius:8px;background:var(--background);padding:10px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer">
          <span style="font-size:12px;line-height:1.5;font-weight:500">${esc(r.title)}</span>
          <span style="font-size:11px;color:var(--muted-foreground);line-height:1.45">${esc(r.notes||'')}</span>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="${smallBadge(r.u)}">${r.u.label}</span>
            <span style="font-size:11px;color:var(--muted-foreground)">${esc(r.requester||'ללא מבקש מתועד')}</span>
            <span style="flex:1"></span>
            <span style="font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums">${r.date?fmt(r.date):'—'}</span>
          </div>
        </div>`).join('');
      return `
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)">
        <div style="display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)">
          <span style="width:8px;height:8px;border-radius:9999px;background:${REQ_STATUS[key].solid};flex-shrink:0"></span>
          <span style="font-size:13px;font-weight:600;flex:1">${REQ_STATUS[key].label}</span>
          <span style="font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums">${cards.length}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;padding:12px;max-height:620px;overflow-y:auto">
          ${cardsHtml || '<span style="font-size:12px;color:var(--muted-foreground);text-align:center;padding:18px 8px;border:1px dashed var(--border);border-radius:8px">אין בקשות בעמודה הזו</span>'}
        </div>
      </div>`;
    }).join('');
    return `<div style="display:flex;flex-direction:column;gap:16px">${toolbar}<div style="display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;align-items:start">${cols}</div></div>`;
  }
  const rowsHtml = filtered.map(decorate).map(r=>`
    <div onclick='openAdd("request", ${JSON.stringify(r).replace(/'/g,"&#39;")})' style="display:grid;grid-template-columns:minmax(300px,1fr) 110px 160px 110px 140px;padding:10px 16px;align-items:center;border-top:1px solid var(--border);font-size:13px;cursor:pointer">
      <span style="display:flex;flex-direction:column;gap:2px;padding-inline-end:14px">
        <span style="font-weight:500">${esc(r.title)}</span>
        <span style="font-size:11px;color:var(--muted-foreground)">${esc(r.notes||'')}</span>
      </span>
      <span style="font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums">${r.date?fmt(r.date):'—'}</span>
      <span style="font-size:12px;color:var(--muted-foreground)">${esc(r.requester||'—')}</span>
      <span><span style="${smallBadge(r.u)}">${r.u.label}</span></span>
      <span><span style="${smallBadge(r.st)}">${r.st.label}</span></span>
    </div>`).join('');
  return `
  <div style="display:flex;flex-direction:column;gap:16px">${toolbar}
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow-x:auto;box-shadow:var(--shadow-sm)">
      <div style="min-width:920px">
        <div style="display:grid;grid-template-columns:minmax(300px,1fr) 110px 160px 110px 140px;padding:0 16px;height:42px;align-items:center;background:var(--muted);font-size:12px;font-weight:600;color:var(--muted-foreground)">
          <span>תיאור הבקשה</span><span>תאריך</span><span>מבקש</span><span>דחיפות</span><span>סטטוס</span>
        </div>
        ${rowsHtml}
      </div>
    </div>
  </div>`;
}

function renderTrainings(){
  const canEdit = ui.role==='editor';
  const q = ui.trainingsQuery.trim().toLowerCase();
  const rows = state.trainings.filter(t=>!q || t.unit.toLowerCase().includes(q))
    .slice().sort((a,b)=>{ if(!a.date&&!b.date) return 0; if(!a.date) return 1; if(!b.date) return -1; return b.date.localeCompare(a.date); });
  const rowsHtml = rows.map(t=>`
    <div onclick='${canEdit?`openAdd("training", ${JSON.stringify(t).replace(/'/g,"&#39;")})`:''}' style="display:grid;grid-template-columns:220px 120px 200px minmax(160px,1fr);padding:10px 16px;align-items:center;border-top:1px solid var(--border);font-size:13px;${canEdit?'cursor:pointer':''}">
      <span style="font-weight:500">${esc(t.unit)}</span>
      <span style="font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums">${t.date?fmt(t.date):'—'}</span>
      <span style="font-size:12px;color:var(--muted-foreground)">${esc(t.instructor||'—')}</span>
      <span style="font-size:12px;color:var(--muted-foreground)">${esc(t.notes||'—')}</span>
    </div>`).join('');
  return `
  <div style="display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <input id="trainingsSearch" type="search" placeholder="סינון לפי שם יחידה" value="${esc(ui.trainingsQuery)}" oninput="onTrainingsSearch(this.value)" style="height:36px;padding:0 12px;border:1px solid var(--input);border-radius:10px;background:var(--background);color:var(--foreground);font-size:13px;width:240px;outline:none" />
      <span style="flex:1"></span>
      ${canEdit?`<button type="button" onclick="openAdd('training')" style="height:36px;padding:0 14px;border:none;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font-size:13px;font-weight:500;cursor:pointer">תיעוד הדרכה</button>`:''}
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-sm)">
      <div style="display:grid;grid-template-columns:220px 120px 200px minmax(160px,1fr);padding:0 16px;height:42px;align-items:center;background:var(--muted);font-size:12px;font-weight:600;color:var(--muted-foreground)">
        <span>יחידה</span><span>תאריך</span><span>מדריך</span><span>הערות</span>
      </div>
      ${rowsHtml || `<div style="padding:64px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border-top:1px solid var(--border)">
        <strong style="font-size:15px;font-weight:600">אין הדרכות מתועדות</strong>
        <span style="font-size:13px;color:var(--muted-foreground);max-width:420px;line-height:1.6">כל הדרכה שמתועדת כאן נכנסת למעקב שיעור ההטמעה ביחידות: יחידה, תאריך, מדריך והערות.</span>
      </div>`}
    </div>
  </div>`;
}

// ==== Modal ====
function fieldWrap(label, inner){ return `<label style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted-foreground)">${esc(label)}${inner}</label>`; }
const CTRL = 'height:36px;padding:0 12px;border:1px solid var(--input);border-radius:10px;background:var(--background);color:var(--foreground);font-size:13px;';

function renderModal(){
  if(!ui.addOpen || !ui.form) return '';
  const f = ui.form;
  let title='', sub='', fields='', deleteBtn='';
  if(ui.addKind==='item'){
    title = f.id ? 'עריכת פריט' : 'פריט חדש'; sub='משימה או אבן דרך; תאריכים אפשר להשלים בהמשך';
    const trackOpts = state.tracks.map(t=>`<option value="${t.id}" ${Number(f.track)===t.id?'selected':''}>${esc(t.name)}</option>`).join('');
    fields = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 14px">
      ${fieldWrap('טראק', `<select id="f-track" onchange="setForm('track', this.value)" style="${CTRL}">${trackOpts}</select>`)}
      ${fieldWrap('סוג', `<select id="f-type" onchange="setForm('type', this.value)" style="${CTRL}"><option value="task" ${f.type==='task'?'selected':''}>משימה</option><option value="milestone" ${f.type==='milestone'?'selected':''}>אבן דרך</option></select>`)}
      <label style="grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted-foreground)">שם הפריט<input type="text" value="${esc(f.name)}" id="f-name" oninput="setForm('name', this.value)" placeholder="לדוגמה: בדיקות אינטגרציה" style="${CTRL}" /></label>
      ${fieldWrap('שותף / אחראי', `<input type="text" value="${esc(f.owner)}" id="f-owner" oninput="setForm('owner', this.value)" placeholder="לדוגמה: צוות פיתוח פנימי" style="${CTRL}" />`)}
      ${fieldWrap('סטטוס', `<select id="f-status" onchange="setForm('status', this.value)" style="${CTRL}"><option value="planned" ${f.status==='planned'?'selected':''}>מתוכנן</option><option value="ongoing" ${f.status==='ongoing'?'selected':''}>בתהליך</option><option value="done" ${f.status==='done'?'selected':''}>הושלם</option></select>`)}
      ${fieldWrap('תאריך התחלה', `<input type="date" value="${esc(f.start)}" id="f-start" oninput="setForm('start', this.value)" style="${CTRL}" />`)}
      ${fieldWrap('תאריך סיום', `<input type="date" value="${esc(f.end)}" id="f-end" oninput="setForm('end', this.value)" style="${CTRL}" />`)}
      <label style="grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted-foreground)">הערות<textarea id="f-notes" oninput="setForm('notes', this.value)" rows="2" style="${CTRL}height:auto;padding:8px 12px;">${esc(f.notes||'')}</textarea></label>
    </div>`;
    if(f.id) deleteBtn = `<button type="button" onclick="deleteItemRec()" style="height:36px;padding:0 16px;border:1px solid var(--red-500);border-radius:10px;background:var(--background);color:var(--red-600);font-size:13px;cursor:pointer;margin-inline-start:auto">מחיקה</button>`;
  } else if(ui.addKind==='partner'){
    title = f.id ? 'עריכת שותף' : 'הוספת שותף'; sub='שם, תפקיד וטראקים רלוונטיים';
    fields = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 14px">
      ${fieldWrap('שם השותף / הגורם', `<input type="text" value="${esc(f.name)}" id="f-name" oninput="setForm('name', this.value)" style="${CTRL}" />`)}
      ${fieldWrap('תפקיד בפרויקט', `<input type="text" value="${esc(f.role)}" id="f-role" oninput="setForm('role', this.value)" style="${CTRL}" />`)}
      <label style="grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted-foreground)">מזהי טראקים (מופרדים בפסיק, לדוגמה 1,2)<input type="text" value="${esc(f.tracksStr)}" id="f-tracksStr" oninput="setForm('tracksStr', this.value)" style="${CTRL}" /></label>
      <label style="grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted-foreground)">הערות<textarea id="f-notes" oninput="setForm('notes', this.value)" rows="2" style="${CTRL}height:auto;padding:8px 12px;">${esc(f.notes||'')}</textarea></label>
    </div>`;
    if(f.id) deleteBtn = `<button type="button" onclick="deletePartnerRec()" style="height:36px;padding:0 16px;border:1px solid var(--red-500);border-radius:10px;background:var(--background);color:var(--red-600);font-size:13px;cursor:pointer;margin-inline-start:auto">מחיקה</button>`;
  } else if(ui.addKind==='training'){
    title = f.id ? 'עריכת הדרכה' : 'תיעוד הדרכה'; sub='יחידה, תאריך ומדריך';
    fields = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 14px">
      ${fieldWrap('יחידה', `<input type="text" value="${esc(f.unit)}" id="f-unit" oninput="setForm('unit', this.value)" placeholder="לדוגמה: גדוד 7031" style="${CTRL}" />`)}
      ${fieldWrap('תאריך ההדרכה', `<input type="date" value="${esc(f.date)}" id="f-date" oninput="setForm('date', this.value)" style="${CTRL}" />`)}
      ${fieldWrap('מי הדריך', `<input type="text" value="${esc(f.instructor)}" id="f-instructor" oninput="setForm('instructor', this.value)" style="${CTRL}" />`)}
      <label style="grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted-foreground)">הערות<textarea id="f-notes" oninput="setForm('notes', this.value)" rows="2" style="${CTRL}height:auto;padding:8px 12px;">${esc(f.notes||'')}</textarea></label>
    </div>`;
    if(f.id) deleteBtn = `<button type="button" onclick="deleteTrainingRec()" style="height:36px;padding:0 16px;border:1px solid var(--red-500);border-radius:10px;background:var(--background);color:var(--red-600);font-size:13px;cursor:pointer;margin-inline-start:auto">מחיקה</button>`;
  } else if(ui.addKind==='request'){
    title = f.id ? 'עריכת בקשת שיפור' : 'בקשת שיפור חדשה'; sub = f.category==='dash' ? 'לדשבורד' : 'לאפליקציה';
    fields = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 14px">
      <label style="grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted-foreground)">תיאור הבקשה<input type="text" value="${esc(f.title)}" id="f-title" oninput="setForm('title', this.value)" style="${CTRL}" /></label>
      ${fieldWrap('מבקש', `<input type="text" value="${esc(f.requester)}" id="f-requester" oninput="setForm('requester', this.value)" style="${CTRL}" />`)}
      ${fieldWrap('תאריך', `<input type="date" value="${esc(f.date)}" id="f-date" oninput="setForm('date', this.value)" style="${CTRL}" />`)}
      ${fieldWrap('דחיפות', `<select id="f-urgency" onchange="setForm('urgency', this.value)" style="${CTRL}">${Object.keys(URGENCY).map(k=>`<option value="${k}" ${f.urgency===k?'selected':''}>${URGENCY[k].label}</option>`).join('')}</select>`)}
      ${fieldWrap('סטטוס', `<select id="f-status" onchange="setForm('status', this.value)" style="${CTRL}">${REQ_STATUS_ORDER.map(k=>`<option value="${k}" ${f.status===k?'selected':''}>${REQ_STATUS[k].label}</option>`).join('')}</select>`)}
      <label style="grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted-foreground)">הערות<textarea id="f-notes" oninput="setForm('notes', this.value)" rows="2" style="${CTRL}height:auto;padding:8px 12px;">${esc(f.notes||'')}</textarea></label>
    </div>`;
    if(f.id) deleteBtn = `<button type="button" onclick="deleteRequestRec()" style="height:36px;padding:0 16px;border:1px solid var(--red-500);border-radius:10px;background:var(--background);color:var(--red-600);font-size:13px;cursor:pointer;margin-inline-start:auto">מחיקה</button>`;
  }
  return `
  <div onclick="closeAdd()" style="position:fixed;inset:0;background:var(--overlay-scrim);display:flex;align-items:center;justify-content:center;z-index:40;padding:24px">
    <div onclick="event.stopPropagation()" style="background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-overlay);width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;flex-direction:column;gap:4px">
        <strong style="font-size:16px;font-weight:600">${esc(title)}</strong>
        <span style="font-size:12px;color:var(--muted-foreground)">${esc(sub)}</span>
      </div>
      ${fields}
      <div style="display:flex;justify-content:flex-start;gap:8px;padding-top:4px">
        <button type="button" onclick="submitAdd()" style="height:36px;padding:0 16px;border:none;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font-size:13px;font-weight:500;cursor:pointer">${f.id?'שמירה':'הוספה'}</button>
        <button type="button" onclick="closeAdd()" style="height:36px;padding:0 16px;border:1px solid var(--input);border-radius:10px;background:var(--background);color:var(--foreground);font-size:13px;cursor:pointer">ביטול</button>
        ${deleteBtn}
      </div>
    </div>
  </div>`;
}

function renderConfirm(){
  if(!ui.confirmOpen) return '';
  return `
  <div style="position:fixed;inset:0;background:var(--overlay-scrim);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px">
    <div style="background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-overlay);width:min(360px,100%);padding:20px;display:flex;flex-direction:column;gap:16px">
      <strong style="font-size:15px;font-weight:600">${esc(ui.confirmMsg)}</strong>
      <div style="display:flex;justify-content:flex-start;gap:8px">
        <button type="button" onclick="confirmYes()" style="height:36px;padding:0 16px;border:none;border-radius:10px;background:var(--red-600);color:#fff;font-size:13px;cursor:pointer">מחיקה</button>
        <button type="button" onclick="confirmNo()" style="height:36px;padding:0 16px;border:1px solid var(--input);border-radius:10px;background:var(--background);color:var(--foreground);font-size:13px;cursor:pointer">ביטול</button>
      </div>
    </div>
  </div>`;
}

function renderContent(){
  switch(ui.view){
    case 'overview': return renderOverview();
    case 'gantt': return renderGantt();
    case 'items': return renderItems();
    case 'partners': return renderPartners();
    case 'tracks': return renderTracks();
    case 'reqApp': return renderRequests('app');
    case 'reqDash': return renderRequests('dash');
    case 'trainings': return renderTrainings();
    default: return '';
  }
}

function renderApp(){
  return `
  <div dir="rtl" lang="he" style="display:flex;min-height:100vh;background:var(--background);color:var(--foreground);font-family:var(--font-hebrew);font-size:14px;line-height:1.5;width:100%">
    ${renderSidebar()}
    <main style="flex:1;min-width:0;display:flex;flex-direction:column">
      ${renderHeader()}
      <div style="flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:20px">${renderContent()}</div>
    </main>
    ${renderModal()}
    ${renderConfirm()}
  </div>`;
}

// ==== Firebase storage shim + boot ====
(async function initStorageAndLoad(){
  try{
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js");
    const { getFirestore, doc, getDoc, setDoc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js");
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const COLLECTION = 'roadmap_data';
    window.storage = {
      get: async (key) => { const snap = await getDoc(doc(db, COLLECTION, key)); return snap.exists() ? { value: snap.data().value } : null; },
      set: async (key, value) => { await setDoc(doc(db, COLLECTION, key), { value, updatedAt: Date.now() }); return true; }
    };
    onSnapshot(doc(db, COLLECTION, STORAGE_KEY), (snap) => {
      if(!snap.exists()) return;
      const remoteState = JSON.parse(snap.data().value);
      if(JSON.stringify(remoteState) !== JSON.stringify(state)){
        state = { ...seed(), ...remoteState };
        ui.saveState = 'עודכן בזמן אמת';
        render();
      }
    });
  } catch(e){
    console.warn('Firebase לא זמין, עובד עם אחסון מקומי בדפדפן בלבד:', e.message);
    window.storage = {
      get: async (key) => { const v = localStorage.getItem(key); return v ? { value: v } : null; },
      set: async (key, value) => { localStorage.setItem(key, value); return true; }
    };
  }
  loadData();
})();
</script>
